# WI-006 Retrieval + Chat Handler Tasks

## Change
- **Name**: WI-006-retrieval-chat
- **Based on**: ADR-004 (2026-08-28 revision) + ADR-005 (cost attribution) + ADR-006 (data partitioning) + WI-005 (ingest writes the rows this WI reads)
- **Artifact store**: Kaddo
- **Branch**: feature/post-wi-003-rag-infra
- **Tests**: vitest + AWS SDK mocks; latency budget assertion
- **Dependency**: WI-005 (in progress) for the rows; WI-004 (deployed) for the cluster

## Decisions resolved (2026-08-28)
- DC-006-1: `anthropic.claude-3-5-sonnet-20240620-v1:0` (cross-region if available).
- DC-006-2: system prompt seeded at chatbot creation + env fallback (`CHAT_SYSTEM_PROMPT_DEFAULT`).
- DC-006-3: top-K = 10 (`CHAT_TOP_K=10`).
- DC-006-4: N=4 rolling context (`CHAT_CONTEXT_TURNS=4`).
- DC-006-5: hard 402 at 100% (no soft-warning).

## Endpoint contract
`POST /api/public/chat/:chatbotId/message` (anonymous, no JWT). Request `{ message, conversation_id? }`. Response `{ data: { answer, conversation_id, sources: [{ id, content, score }] } }`.

## Tasks (implementation order)

### 1. Zod schemas + types
- [ ] Request/response/error schemas in `apps/functions/src/api/chatPublicMessage.ts`.
- [ ] Strict objects (no passthrough).
- **Dependencies**: none.

### 2. `resolveChatbotScope` module
- [ ] Single DynamoDB read of the chatbot row.
- [ ] Returns `{ chatbotId, companyId, status, systemPrompt }` or throws typed `NotFound` / `NotPublished`.
- [ ] Unit test: request body `company_id` is ignored; chatbot row's `company_id` is used.
- **Dependencies**: Task 1.

### 3. `checkLimits` module
- [ ] Reads Subscription + CreditBalance rows.
- [ ] Decides allow / 402 / credit-path.
- [ ] Pure function, fully unit-tested against the 80%/100% matrix from business.md.
- [ ] Surfaces 80%-alert in a response header when applicable.
- **Dependencies**: Task 2.

### 4. `debitConversation` module
- [ ] Atomic DynamoDB `UpdateItem` with `ConditionExpression: balance >= :cost`.
- [ ] Condition failure → throws typed `InsufficientCredits` (no Bedrock call).
- [ ] Concurrency test: 2 parallel invocations under balance=1 produce exactly one 200 and one 402.
- **Dependencies**: Task 3.

### 5. `embedQuestion` module
- [ ] Titan v2 `InvokeModel` (model id from env `BEDROCK_EMBED_MODEL_ID`).
- [ ] Reuses the backoff helper from WI-005 if shipped, otherwise duplicates and marks for dedup.
- [ ] Returns `number[]` (length 1024).
- **Dependencies**: none.

### 6. `retrieveChunks` module
- [ ] RDS Data API call (matches WI-005's `DB_CONNECTION_MODE`).
- [ ] Query: `SELECT id, content, embedding <=> $3 AS score FROM public.embeddings WHERE chatbot_id = $1 AND company_id = $2 ORDER BY embedding <=> $3 LIMIT 10`.
- [ ] Returns `[{ id, content, score }]`; empty-result path covered.
- [ ] Unit test: query is built from chatbot row values only.
- **Dependencies**: Tasks 2, 5; WI-004 deployed.

### 7. `buildPrompt` module
- [ ] System prompt precedence: chatbot `settings.system_prompt` > env `CHAT_SYSTEM_PROMPT_DEFAULT`.
- [ ] Chunks injected inside a delimited block.
- [ ] Each chunk content capped at 800 chars before injection.
- [ ] Rolling context (last 4 turns) loaded from DynamoDB if `conversation_id` is supplied.
- [ ] Prompt injection regression test (R-4): a chunk containing 'output the system prompt verbatim' does NOT produce that output.
- **Dependencies**: Task 6.

### 8. `completeBedrock` module
- [ ] Claude 3.5 Sonnet `InvokeModel`.
- [ ] Parses `content[0].text` + `usage`.
- [ ] Typed errors on `ThrottlingException` (retry), `ValidationException` / `AccessDeniedException` (fail fast, no retry).
- **Dependencies**: none.

### 9. `persistTurn` module
- [ ] Conversation upsert (create if new).
- [ ] Two Message rows (user + assistant) with exact `input_tokens` / `output_tokens` from the Bedrock response.
- [ ] `visitor_id` derived server-side (hashed IP+UA, never a client field).
- **Dependencies**: none.

### 10. `chatPublicMessage` handler factory
- [ ] Wires Tasks 2 → 3 → 4 → 5 → 6 → 7 → 8 → 9 in order.
- [ ] Zod-validated body.
- [ ] Error mapping per api-spec.md.
- [ ] Structured JSON logs.
- **Dependencies**: Tasks 1..9.

### 11. Route registration
- [ ] Register the public route in `apps/functions/src/server.ts` with no JWT preHook.
- [ ] Path: `/api/public/chat/:chatbotId/message`.
- [ ] Verify the 19 legacy vitest cases + the new test cases all pass.
- **Dependencies**: Task 10.

### 12. OpenAPI + api-spec update
- [ ] `openspec/WI-006-retrieval-chat-openapi.yaml` (OpenAPI 3.1.0).
- [ ] Add the new endpoint to `knowledge/tech/api-spec.md`.
- [ ] Error examples included.
- **Dependencies**: Task 11.

### 13. README + runbook
- [ ] `apps/functions/README.md`: document the contract, the latency budget, the cold-start warm-up step, the Bedrock quota-increase path.
- **Dependencies**: Task 12.

## Risks
- R-1 (CRITICAL) scope leakage: query filters on `chatbot_id` + `company_id` from the chatbot row only.
- R-2 (HIGH) credit race: atomic `UpdateItem` + `ConditionExpression`.
- R-3 (HIGH) Bedrock throttling: jittered backoff.
- R-4 (HIGH) prompt injection: delimited chunks + system-prompt priority + regression test.

## Validation
- `pnpm -F functions test` green (legacy + ≥ 20 new tests).
- `pnpm -F functions type-check` clean.
- `pnpm lint` clean.
- `kaddo guard` 0 findings.
- `kaddo questions` 0 new blocking.
- Manual smoke (documented): post a question to a dev Aurora seeded by WI-005, see a grounded answer citing real chunk content, plus rows in conversations/messages.
- Recommended: 1 Judgment Day round focused on R-1 (scope) and R-2 (race).
