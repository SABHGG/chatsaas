# WI-004 CDK App Bootstrap Tasks

## Change
- **Name**: WI-004-cdk-app-bootstrap-with-neon-pgvector
- **Based on**: ADR-008 (2026-09-05) — Neon replaces Aurora as the vector store
- **Artifact store**: Kaddo
- **Branch**: feature/WI-004-neon-vector-store
- **Tests**: vitest + aws-cdk-lib/assertions + manual smoke against a real Neon dev project

## Tasks (implementation order)

### 1. Neon project + SSM parameter
- [ ] Create a Neon project (region us-east-1, `main` branch) for the dev environment.
- [ ] Copy the pooled connection string (hostname includes `-pooler`) from the Neon console.
- [ ] Store it in SSM Parameter Store as a SecureString named `chatsaas-{env}-neon-url` (free; replaces the Secrets Manager credential path).
- [ ] Record the Neon project id, region, and branch in `infra/README.md`.
- **Dependencies**: none.

### 2. pgvector migration script + runbook
- [ ] Create `infra/db/migrations/001-embeddings-pgvector.sql` porting the SQL from `infra/lib/embeddings-table-resource.ts` (`EMBEDDINGS_TABLE_SQL`) and `infra/lib/ingest-embeddings-index.ts` (`EMBEDDINGS_UNIQUE_INDEX_SQL`): `CREATE EXTENSION IF NOT EXISTS vector`, the `public.embeddings` table, the HNSW index on `embedding vector_cosine_ops`, the composite `(chatbot_id, company_id)` index, the `content_sha256` column, and the unique `(chatbot_id, content_sha256)` index + `ANALYZE`.
- [ ] Every statement idempotent (`IF NOT EXISTS`).
- [ ] Document the runbook step (how to run the migration against the Neon `main` branch) in `infra/README.md`.
- **Dependencies**: Task 1.

### 3. Delete Aurora-era constructs + stack wiring cleanup
- [ ] Delete `infra/lib/aurora-pgvector.ts`, `infra/lib/rds-proxy.ts`, `infra/lib/database-secret.ts`, `infra/lib/security-groups.ts`, `infra/lib/vpc.ts`, `infra/lib/embeddings-table-resource.ts`, `infra/lib/ingest-embeddings-index.ts`.
- [ ] Remove all wiring from `infra/lib/chat-saas-stack.ts`: cluster, proxy, secret rotation, security groups, VPC, custom resources, and their outputs.
- [ ] Remove now-unused RDS-era dependencies from `infra/package.json` (`@aws-sdk/client-rds-data`, etc.).
- **Dependencies**: none.

### 4. Ingest Lambda de-VPC + SSM grant + driver swap
- [ ] In `infra/lib/ingest-lambda.ts`: remove `vpc` / `vpcSubnets` / `securityGroups` props — the Lambda is non-VPC; all AWS service calls use public endpoints.
- [ ] Replace the `rds-data:ExecuteStatement` IAM statement with least-privilege `ssm:GetParameter` on the `chatsaas-{env}-neon-url` parameter.
- [ ] Swap the handler DB calls to `@neondatabase/serverless` (fetch-based HTTP driver preferred) over the pooled endpoint; preserve the `INSERT ... ON CONFLICT (chatbot_id, content_sha256) DO NOTHING` semantics.
- [ ] Add `@neondatabase/serverless` to the Lambda bundle and verify the esbuild config handles it (fetch-based ESM, no native deps).
- **Dependencies**: Task 1, Task 3.

### 5. Stack outputs update
- [ ] Remove ClusterEndpoint / ProxyArn / SecretArn outputs.
- [ ] Add `NeonUrlParameterName` output (SSM parameter name).
- **Dependencies**: Task 3, Task 4.

### 6. Vitest suite update
- [ ] Update `infra/test/`: remove all `DBCluster` / `DBProxy` / VPC / Secrets Manager assertions and the tests of the deleted constructs.
- [ ] Assert the ingest Lambda config has NO `vpc` / `securityGroups`.
- [ ] Assert the ingest Lambda policy contains `ssm:GetParameter` scoped to the Neon URL parameter.
- [ ] Keep bucket / EventBridge / documents-table assertions green.
- **Dependencies**: Tasks 3–5.

### 7. Synth validation
- [ ] `cdk synth` produces a template with NO `AWS::RDS::*` and NO VPC/EC2 data-plane resources.
- [ ] `pnpm -F infra test` is green.
- [ ] `pnpm type-check` at the root is 0 errors.
- **Dependencies**: Task 6.

### 8. Validation smoke against real Neon + commit
- [ ] Run the migration script against the Neon dev project (`main` branch): pgvector extension + embeddings table + HNSW index + unique index all applied.
- [ ] Ingest smoke test: upload a fixture document and verify embeddings rows land in Neon end-to-end (floci cannot emulate Neon — requires a real Neon free project).
- [ ] Commit on `feature/WI-004-neon-vector-store` with message `feat(WI-004): swap Aurora for Neon as vector store`.
- **Dependencies**: All previous tasks.

## Dependencies

- `@neondatabase/serverless` (Neon serverless driver for the ingest Lambda)
- `aws-cdk-lib` + `constructs` (existing)
- `@aws-sdk/client-ssm` — SSM read from the ingest Lambda (available in the Node.js Lambda runtime or bundled)
- `vitest` + `aws-cdk-lib/assertions` (existing)

## Out of Scope

- Retrieval-path code changes (WI-006 completed record notes the supersession).
- Cognito User Pool provisioning.
- Bedrock Knowledge Base wiring (WI-005).
- Production Neon project, branching strategy for staging, multi-region.
- Rotation Lambda implementation (the concept is deleted along with Secrets Manager).
