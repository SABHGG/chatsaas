# WI-010 Board Polish + Spanish Landing Tasks

## Change
- **Name**: WI-010-board-polish-spanish-landing
- **Based on**: ADR-007 (visual system) + WI-007 (Flight-Strip world, completed) + DESIGN.md
- **Artifact store**: Kaddo
- **Branch**: feature/board-polish-landing
- **Tests**: vitest (happy-dom) — landing redirect/content + world-contract guard
- **Dependency**: none new (WI-007 world already landed; board data paths exist)

## Recorded decision (founder, 2026-09-06)
- The landing page copy is **Spanish** — an explicit user decision that
  overrides the PRODUCT.md English-UI assumption **for the landing route only**.
  Board/wizard/plan/login/visitor surfaces stay English-only; the world
  contract guard keeps enforcing English everywhere except the landing route
  group. Pricing stays qualitative (no invented numbers); no fabricated social
  proof.

