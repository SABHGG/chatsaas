## Risks
- R-1 (MEDIUM) Spanish copy vs world-contract guard → surgical `(landing)`
  exclusion, everything else still enforced.
- R-2 (LOW) Root regression for operators → session gate server-side; session
  read failure degrades to the landing.
- R-3 (LOW) Pricing invention → qualitative copy only.
- R-4 (LOW) Scope creep into a board rebuild → polish only.

