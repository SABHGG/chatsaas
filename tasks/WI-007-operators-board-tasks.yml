## Risks
- R-1 (CRITICAL) visual drift into the blue SaaS rut: replaced scaffold, kaddo guard enforces.
- R-2 (HIGH) Cognito callback mishandling: full route test.
- R-3 (HIGH) wizard draft loss: Zustand persist + useHydrated + full reload test.
- R-5 (MEDIUM) publish before ingest ready: disabled with override + dialog.
- R-6 (MEDIUM) iframe security: sandbox + referrerpolicy + exact-string test.
- R-7 (MEDIUM) CSRF: X-Requested-With header + vitest.

## Validation
- `pnpm -F web type-check`, `pnpm -F web lint`, `pnpm -F web test` all green.
- Playwright e2e green.
- `kaddo guard` 0 findings.
- `kaddo questions` 0 new blocking.
- Manual smoke (documented in `apps/web/README.md`): dev server, sign in, create a chatbot, upload a PDF, publish, copy iframe snippet, paste into a blank HTML, ask a question, see the grounded answer.
