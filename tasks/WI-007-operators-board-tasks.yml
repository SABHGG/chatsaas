# WI-007 Operator's Board Tasks

## Change
- **Name**: WI-007-operators-board
- **Based on**: ADR-007 (The Operator's Board visual world) + WI-005 (upload) + WI-006 (chat) + WI-008 (auth) + PRODUCT.md (English copy)
- **Artifact store**: Kaddo
- **Branch**: feature/post-wi-003-rag-infra
- **Tests**: vitest + Playwright (e2e happy path)
- **Dependencies**: WI-008 (auth), WI-005 (upload), WI-006 (chat) all implemented and deployed

## Decisions resolved (2026-08-28)
- DC-007-1: tokens (Patch Amber `#B8860B`, Operator's Ivory `#F8F4E9`, Slate Ink `#2D3142`, Hairline Slate `#D6D2C4`; Inter + IBM Plex Mono).
- DC-007-2: permissive publish with 0 ready documents (confirmation dialog).
- DC-007-3: "Contact us" modal placeholder for prepayment.
- DC-007-4: NO dark mode in this WI (per ADR-007).
- DC-007-5: per-component `useHydrated` guard.

## Visual contract (ADR-007)
- **Live Line Rule**: Patch Amber only on the lit jack of a published bot and the primary create/publish control.
- **Jack Label Rule**: short, machine-precise labels; never a sentence.
- **Flat-by-Default Rule**: surfaces flat at rest; only the lit jack at publish elevates.
- **Line vocabulary**: unplugged / connecting / live / on hold.
- **English copy only** per PRODUCT.md.

