openapi: 3.1.0
info:
  title: chatSaaS Backend API (implemented surface)
  description: >
    Consolidated API reference for every endpoint currently implemented in
    `apps/functions/src`, including the WI-001 chatbot management and public
    widget surface. Public chat message sending is documented in detail in
    WI-006-retrieval-chat-openapi.yaml.
  version: "1.0.0"
  contact:
    name: chatsaas Team
servers:
  - url: http://localhost:3001
    description: Local development server
# No global security requirement: in the local sandbox the auth verifier is
# stubbed (fixed sub + custom:company_id), so requests must NOT send an
# Authorization header. In production, admin routes require a Cognito access
# token (bearer JWT, scheme `cognitoJwt` in components); public routes already
# declare `security: []` per operation.
paths:
  /healthz:
    get:
      summary: Liveness probe
      operationId: healthz
      tags: [Health]
      security: []
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }
                required: [status]
  /api/credits/balance:
    get:
      summary: Get the authenticated user's credit balance
      operationId: getCreditsBalance
      tags: [Credits]
      responses:
        "200":
          description: Current balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceResponse"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
  /api/credits/debit:
    post:
      summary: Debit credits for an action (atomic conditional decrement)
      operationId: debitCredits
      tags: [Credits]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount: { type: integer, minimum: 1 }
                reason: { type: string, nullable: true }
              required: [amount]
              additionalProperties: false
        example:
          amount: 5
          reason: sandbox-test
      responses:
        "200":
          description: Debit applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewBalanceResponse"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "402":
          description: Insufficient credits (atomic ConditionExpression failure)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
  /api/credits/replenish:
    post:
      summary: Add credits to the user's balance
      operationId: replenishCredits
      tags: [Credits]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount: { type: integer, minimum: 1 }
              required: [amount]
              additionalProperties: false
        example:
          amount: 100
      responses:
        "200":
          description: Replenish applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewBalanceResponse"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
  /api/plans/available:
    get:
      summary: List available subscription plans
      operationId: listAvailablePlans
      tags: [Plans]
      responses:
        "200":
          description: Active plans
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Plan"
                required: [success, data]
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
  /api/plans/subscribe:
    post:
      summary: Subscribe the authenticated user to a plan
      operationId: subscribeToPlan
      tags: [Plans]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                planId: { type: string }
                paymentMethodId: { type: string, nullable: true }
              required: [planId]
              additionalProperties: false
        example:
          planId: pro
      responses:
        "200":
          description: Subscription created/updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      status: { type: string }
                      planId: { type: string }
                      currentPeriodEnd: { type: string, format: date-time }
                    required: [status, planId, currentPeriodEnd]
                required: [success, data]
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
  /api/content/{id}:
    get:
      summary: Get content by ID
      operationId: getContentById
      tags: [Content]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Content record
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      id: { type: string }
                      title: { type: string, nullable: true }
                      message: { type: string, nullable: true }
                      authorId: { type: string }
                      createdAt: { type: string, format: date-time }
                      status: { type: string }
                    required: [id, authorId, createdAt, status]
                required: [success, data]
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
  /api/chatbots:
    get:
      summary: List chatbots for the caller's company (draft + published)
      operationId: listChatbots
      tags: [Chatbots]
      responses:
        "200":
          description: Chatbots owned by the caller's company (archived excluded)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Chatbot"
                required: [success, data]
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "403":
          description: Token present but missing custom:company_id claim
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
    post:
      summary: Create a chatbot (draft)
      operationId: createChatbot
      tags: [Chatbots]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                description: { type: string, maxLength: 2000, nullable: true }
              required: [name]
              additionalProperties: false
        example:
          name: Mi Bot
          description: bot de pruebas
      responses:
        "201":
          description: Draft chatbot created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    $ref: "#/components/schemas/Chatbot"
                required: [success, data]
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "403":
          description: Missing company_id claim
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
  /api/chatbots/published:
    get:
      summary: List published chatbots with public URL + iframe snippet
      operationId: listPublishedChatbots
      tags: [Chatbots]
      responses:
        "200":
          description: Published chatbots owned by the caller's company
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/Chatbot"
                        - type: object
                          properties:
                            url: { type: string }
                            iframe_src: { type: string }
                          required: [url, iframe_src]
                required: [success, data]
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "403":
          description: Missing company_id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
  /api/chatbots/{chatbotId}:
    patch:
      summary: Update chatbot metadata (name, description)
      operationId: updateChatbot
      tags: [Chatbots]
      parameters:
        - name: chatbotId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                description: { type: string, maxLength: 2000, nullable: true }
              additionalProperties: false
        example:
          name: Mi Bot renombrado
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    $ref: "#/components/schemas/Chatbot"
                required: [success, data]
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "403":
          description: Owned by another company / missing company_id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "404":
          description: Chatbot not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
    delete:
      summary: Archive a chatbot (soft delete)
      operationId: archiveChatbot
      tags: [Chatbots]
      parameters:
        - name: chatbotId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Archived (status = archived, row kept)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { type: "null" }
                required: [success, data]
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "403":
          description: Owned by another company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "404":
          description: Chatbot not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
  /api/chatbots/{chatbotId}/publish:
    post:
      summary: Publish a chatbot (idempotent) and get its public URL + iframe
      operationId: publishChatbot
      tags: [Chatbots]
      parameters:
        - name: chatbotId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                plan_id: { type: string, minLength: 1 }
              required: [plan_id]
              additionalProperties: false
            example:
              plan_id: pro
      responses:
        "202":
          description: Published (or re-published; timestamps refreshed)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      status: { type: string, const: published }
                      url: { type: string }
                      iframe_src: { type: string }
                      expires_at: { type: "null" }
                    required: [status, url, iframe_src, expires_at]
                required: [success, data]
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "403":
          description: Owned by another company / missing company_id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "404":
          description: Chatbot not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
  /api/public/chatbots/{chatbotId}/config:
    get:
      summary: Public widget config for a published chatbot (anonymous)
      operationId: getPublicChatbotConfig
      tags: [Public Chatbots]
      security: []
      parameters:
        - name: chatbotId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Widget initialization payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      chatbotId: { type: string }
                      name: { type: string }
                      status: { type: string, const: published }
                      expires_at: { type: "null" }
                    required: [chatbotId, name, status, expires_at]
                    additionalProperties: false
                required: [success, data]
        "404":
          description: Chatbot not found or not published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
  /api/public/chatbots/{chatbotId}/iframe:
    get:
      summary: Public iframe embed snippet (anonymous)
      operationId: getPublicChatbotIframe
      tags: [Public Chatbots]
      security: []
      parameters:
        - name: chatbotId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Iframe snippet
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      iframe_src: { type: string }
                      expires_at: { type: "null" }
                    required: [iframe_src, expires_at]
                    additionalProperties: false
                required: [success, data]
        "404":
          description: Chatbot not found or not published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
  /api/chatbots/{chatbotId}/documents:
    post:
      summary: Upload a document for a chatbot (multipart raw bytes, content-sniffed)
      description: >
        Raw file bytes in the body (max 10 MB). Metadata travels in headers:
        `x-filename`. The MIME type is detected server-side from the byte
        signature — the client `x-mime-type` header is not trusted.
        Allowed: PDF, DOCX, TXT, MD.
      operationId: uploadDocument
      tags: [Documents]
      parameters:
        - name: chatbotId
          in: path
          required: true
          schema: { type: string }
        - name: x-filename
          in: header
          required: true
          schema: { type: string }
          example: manual.txt
      requestBody:
        required: true
        content:
          application/pdf:
            schema: { type: string, format: binary }
          application/octet-stream:
            schema: { type: string, format: binary }
          text/plain:
            schema: { type: string }
          text/markdown:
            schema: { type: string }
      responses:
        "201":
          description: Stored in S3 and registered in DynamoDB
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      documentId: { type: string }
                      status: { type: string }
                      s3Key: { type: string }
                      companyId: { type: string }
                      chatbotId: { type: string }
                    required: [documentId, status, s3Key, companyId, chatbotId]
                    additionalProperties: false
                required: [success, data]
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "403":
          description: Chatbot owned by another company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "415":
          description: Unsupported media type / disallowed file type
    get:
      summary: List documents for a chatbot
      operationId: listDocuments
      tags: [Documents]
      parameters:
        - name: chatbotId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Documents owned by the caller's company
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/DocumentSummary"
                required: [success, data]
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "403":
          description: Chatbot owned by another company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
  /api/documents/{documentId}:
    get:
      summary: Get document metadata / status
      operationId: getDocument
      tags: [Documents]
      parameters:
        - name: documentId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Document record
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    $ref: "#/components/schemas/DocumentSummary"
                required: [success, data]
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthError"
        "404":
          description: Not found
  /api/chat/public:
    get:
      summary: List recent public messages (legacy WI-002 demo surface)
      operationId: listPublicMessages
      tags: [Public Chat (legacy)]
      security: []
      responses:
        "200":
          description: Recent messages
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        content: { type: string }
                        username: { type: string, nullable: true }
                        createdAt: { type: string, format: date-time }
                        type: { type: string }
                      required: [id, content, createdAt, type]
                required: [success, data]
    post:
      summary: Create a public message (legacy WI-002 demo surface)
      operationId: createPublicMessage
      tags: [Public Chat (legacy)]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content: { type: string, minLength: 1, maxLength: 1000 }
                username: { type: string, nullable: true }
              required: [content]
              additionalProperties: false
        example:
          content: hola mundo
          username: tester
      responses:
        "201":
          description: Message created
        "400":
          description: Invalid message format
  /api/public/chat/{chatbotId}/message:
    post:
      summary: Send a visitor message to a published chatbot (anonymous, WI-006)
      description: >
        Full contract in openspec/WI-006-retrieval-chat-openapi.yaml (error
        examples, fallback semantics, x-credit-alert header, latency budget).
      operationId: sendPublicChatMessage
      tags: [Public Chat]
      security: []
      parameters:
        - name: chatbotId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message: { type: string, minLength: 1, maxLength: 2000 }
                conversation_id: { type: string, format: uuid }
              required: [message]
              additionalProperties: false
        example:
          message: Ask a question about the uploaded document.
      responses:
        "200":
          description: Grounded answer (or configured fallback on empty retrieval)
        "400":
          description: Validation failed
        "402":
          description: Monthly limit exhausted / prepaid credits exhausted
        "404":
          description: Chatbot not found or not published
        "500":
          description: Bedrock or database failure
components:
  securitySchemes:
    cognitoJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Amazon Cognito access token in the Authorization header.
  schemas:
    BalanceResponse:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: object
          properties:
            balance: { type: integer, minimum: 0 }
          required: [balance]
          additionalProperties: false
      required: [success, data]
    NewBalanceResponse:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: object
          properties:
            newBalance: { type: integer, minimum: 0 }
          required: [newBalance]
          additionalProperties: false
      required: [success, data]
    Plan:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        monthly_conversation_limit: { type: integer }
        monthly_credit_allocated: { type: integer }
        price_monthly: { type: integer, description: cents }
        status: { type: string, enum: [active, inactive] }
      required: [id, name, monthly_conversation_limit, monthly_credit_allocated, price_monthly, status]
    Chatbot:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        status:
          type: string
          enum: [draft, published, archived]
        document_count: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        published_at: { type: string, format: date-time, nullable: true }
      required: [id, name, status, document_count, created_at, updated_at, published_at]
    DocumentSummary:
      type: object
      properties:
        documentId: { type: string }
        fileName: { type: string }
        status: { type: string }
        chatbotId: { type: string }
        companyId: { type: string }
        createdAt: { type: string, format: date-time }
      required: [documentId, status]
    AuthError:
      type: object
      properties:
        success: { type: boolean, const: false }
        error: { type: string }
        code: { type: string }
      required: [success, error, code]
